[project]
name = "jaga-pipeline"
version = "0.1.0"
description = "Jaga science pipeline: data ingestion and hydrology/GIS analysis"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.36",
    "geopandas>=1.2.0",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyogrio>=0.13.0",
    "pyyaml>=6",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
