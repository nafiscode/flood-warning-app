[project]
name = "jaga-pipeline"
version = "0.1.0"
description = "Jaga science pipeline: data ingestion and hydrology/GIS analysis"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.36",
    "earthengine-api>=1.7.46",
    "geopandas>=1.2.0",
    "google-api-python-client>=2.201.0",
    "httpx>=0.27",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyogrio>=0.13.0",
    "pyproj>=3.7.2",
    "pyyaml>=6",
    "rasterio>=1.4.4",
    "shapely>=2.1.2",
    "whitebox>=2.3.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
