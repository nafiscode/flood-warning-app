# Science plan Module 9: is this flood season likely to be a wet one? This package holds the
# evidence from the past; the outlook itself is a later step (see METHODS.md).
output_dir: out/seasonal_outlook
user_agent: "jaga-pipeline/0.1 (+https://github.com/nafiscode/flood-warning-app; {contact})"
provinces: ["90", "94", "95", "96"]

# Rain: CHIRPS five-day totals (UCSB Climate Hazards Center, public domain), about 5.5 km, 1981 on.
chirps_pentad: UCSB-CHG/CHIRPS/PENTAD
scale_m: 5566
simplify_deg: 0.01
first_season: 1981
last_year: 2026
years_per_request: 8

# The Pacific: NOAA's Oceanic Nino Index (three-month means, public domain).
oni_url: https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt
enso_months: JAS            # the newest value known in mid-October, when the outlook would be made
baseline: [1991, 2020]      # the seasons that define "normal" and the thirds
rank_from: 2017

# A second record: ERA5-Land, ECMWF's land reanalysis (about 11 km, 1950 on; Copernicus licence).
era5:
  collection: ECMWF/ERA5_LAND/DAILY_AGGR
  band: total_precipitation_sum      # metres a day; multiplied by 1000
  scale_m: 11132
# The ThaiWater gauges: a province-day counts when at least this many stations reported.
gauges_min_stations: 3

# The seasonal forecast models: NOAA CPC's North American Multi-Model Ensemble, CPT text files
# (public domain, no account). Forecasts made at the start of October for November to January.
models:
  base_url: https://ftp.cpc.ncep.noaa.gov/International/nmme
  hindcast_dir: seasonal_nmme_hindcast_in_cpt_format
  forecast_dir: seasonal_nmme_forecast_in_cpt_format
  hindcast_file: "{model}_precip_hcst_Octic_11-1_1991-2021.txt"
  forecast_file: "{model}_precip_fcst_Octic_11-1_2026-2027.txt"
  names: [nmme, cfsv2, cmc1, cmc2, nasa, ncar_ccsm4, ncar_cesm1]
  # 1-degree cell centres over the four provinces
  lons: [100.0, 101.0, 102.0]
  lats: [6.0, 7.0]
