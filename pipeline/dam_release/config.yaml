# S7, docs/science-plan.md Module 7: the path water takes when Bang Lang releases, and the
# criteria the app grades the dam's live figures by.
#
# The geometry here is OpenStreetMap's, decided on 10 Oct 2026 as the interim source: it says
# where the river runs, not how far the water spreads. Steps 2-3 of S7 (travel times, and the
# zone from HAND and the radar extents) will produce a second version to compare against, which
# is why every reach carries a `source` and both can sit in the database at once.

output_dir: out/dam_release
user_agent: "jaga-pipeline/0.1 (+https://github.com/nafiscode/flood-warning-app; {contact})"
overpass_url: https://overpass-api.de/api/interpreter
# The waterway cache the hazard module already filled, so no new Overpass request is needed for
# the river itself (hazard/config.yaml output_dir + /osm).
waterway_cache: out/hazard/osm

# How much detail survives into the database. 10 m is finer than anything the map draws at and
# keeps the seed small.
simplify_m: 10

dams:
  - code: bang_lang
    name: {th: "เขื่อนบางลาง", ms: "Empangan Bang Lang", en: "Bang Lang Dam"}
    river: {th: "แม่น้ำปัตตานี", ms: "Sungai Patani", en: "Pattani River"}
    operator: EGAT
    province: "95"
    # EGAT publishes Bang Lang hourly; ThaiWater's dam_hourly_graph is where that comes from.
    feed: hourly
    # Whose home screen carries its figure (the owner, 12 Oct): Yala, Pattani and Narathiwat.
    # ThaiWater lists the same dam twice: EGAT's hourly feed and the RID's daily report.
    thaiwater: {hourly_id: 50, daily_id: 26}
    # Positions given by the owner, 9 Oct 2026.
    dam_point: [101.2721, 6.1551]
    spillway_point: [101.2764, 6.1501]
    # The reservoir as OpenStreetMap maps it: a multipolygon relation, 33 outer ways and 14
    # islands (checked 10 Oct 2026). Its own name:en tag is wrong ("Mae Wat Bypass Road"), so the
    # names above are ours, not OSM's.
    reservoir_relation: 3224558
    # The mapped channel that carries water away from the dam. The walk downstream starts here
    # and follows the digitised direction, which for waterways is the direction of flow.
    outlet_way: 1336823769
    storage:
      max_mcm: 1589.8       # the reservoir full
      normal_mcm: 1454.4    # normal high water, above which the spillway comes into use
    tributaries:
      # A tributary whose whole mapped network is shorter than this is left out: it cannot back
      # up enough water to be worth drawing.
      min_network_km: 5
      # How far up from the junction counts as the "lower reach" that a rising main stem backs
      # water into (spec section 15).
      lower_reach_km: 5

  # --- The Royal Irrigation Department's reservoirs (added 14 Oct 2026, the owner's request that
  # --- every reservoir that matters to the flood be treated like Bang Lang).
  #
  # They are a different kind of dam and it shows in every field below:
  #   * ThaiWater publishes them **once a day**, in the dam_medium list of /analyst/dam, and has
  #     no history endpoint for them at all - so `feed: daily`, and the archive starts the day
  #     Jaga starts asking.
  #   * There are no turbines, so "above the turbines" means nothing. Each carries its own grade
  #     rules, scaled to its own capacity, and they are **provisional**: with no archive there is
  #     nothing to measure a percentile against, so the rules are stated in plain proportions
  #     (METHODS.md, "The RID reservoirs") and should be revisited after a season of readings.
  #   * `normal_storage` from ThaiWater is the capacity at normal high water, which is also the
  #     figure its percentage is of; we have no separate spillway-crest capacity for them, so
  #     max and normal are the same number and "above normal high" means above 100%.
  - code: khlong_sadao
    # Inside the basin the thresholds module has GSMaP rain for, so `spill` can print the
    # satellite's wettest day beside the rain gauge's as a check.
    rain_basin: u_taphao.above_key
    name: {th: "อ่างเก็บน้ำคลองสะเดา", ms: "Empangan Khlong Sadao", en: "Khlong Sadao Reservoir"}
    river: {th: "คลองอู่ตะเภา", ms: "Sungai U-Taphao", en: "Khlong U-Taphao"}
    operator: RID
    province: "90"
    feed: daily
    thaiwater: {hourly_id: null, daily_id: 791}
    dam_point: [100.496316, 6.583822]
    spillway_point: null
    # Not mapped in OpenStreetMap (Overpass, 14 Oct 2026): the reservoir has no outline, which the
    # database allows. The release path below it is mapped, and that is what matters.
    reservoir_relation: null
    reservoir_way: null
    outlet_way: 1055050832
    storage: {max_mcm: 56.741, normal_mcm: 56.741}
    tributaries: {min_network_km: 5, lower_reach_km: 5}
    grades:
      # A day's release worth more than a tenth of the reservoir: 5.7 Mm3 = 66 m3/s down a
      # channel that runs through Hat Yai.
      turbine_max_cms: 65.7
      release_reason: release_high
      inflow_high_cms: 131.0      # a fifth of the reservoir arriving in a day
      rise_mcm_per_h: 0.118       # a twentieth of the reservoir in a day
      rise_window_h: 1            # one reading back, which on a daily feed is yesterday
      min_consecutive_h: 1        # a daily figure is already a day's mean; two would be two days
      stale_after_h: 48

  - code: khlong_la
    # Inside the basin the thresholds module has GSMaP rain for, so `spill` can print the
    # satellite's wettest day beside the rain gauge's as a check.
    rain_basin: u_taphao.above_key
    name: {th: "อ่างเก็บน้ำคลองหลา", ms: "Empangan Khlong La", en: "Khlong La Reservoir"}
    river: {th: "คลองหลา", ms: "Sungai La", en: "Khlong La"}
    operator: RID
    province: "90"
    feed: daily
    thaiwater: {hourly_id: null, daily_id: 600}
    dam_point: [100.32696, 6.879715]
    spillway_point: null
    reservoir_way: 154336910
    reservoir_relation: null
    # OSM maps 8 km of this stream and then stops, 6 km short of Khlong U-Taphao (measured
    # 14 Oct 2026). The path shown is what is mapped; it is not the whole way the water travels.
    outlet_way: 1501952725
    storage: {max_mcm: 21.42, normal_mcm: 21.42}
    tributaries: {min_network_km: 5, lower_reach_km: 5}
    grades:
      turbine_max_cms: 24.8
      release_reason: release_high
      inflow_high_cms: 49.6
      rise_mcm_per_h: 0.045
      rise_window_h: 1
      min_consecutive_h: 1
      stale_after_h: 48

  - code: khlong_chamrai
    # Inside the basin the thresholds module has GSMaP rain for, so `spill` can print the
    # satellite's wettest day beside the rain gauge's as a check.
    rain_basin: u_taphao.above_key
    name: {th: "อ่างเก็บน้ำคลองจำไหร", ms: "Empangan Khlong Chamrai", en: "Khlong Chamrai Reservoir"}
    river: {th: "คลองจำไหร", ms: "Sungai Chamrai", en: "Khlong Chamrai"}
    operator: RID
    province: "90"
    feed: daily
    thaiwater: {hourly_id: null, daily_id: 599}
    dam_point: [100.334122, 6.829716]
    spillway_point: null
    reservoir_way: 154336927
    reservoir_relation: null
    # No channel mapped below it (Overpass and the cached network, 14 Oct 2026): figures only.
    outlet_way: null
    storage: {max_mcm: 6.0, normal_mcm: 6.0}
    tributaries: {min_network_km: 5, lower_reach_km: 5}
    grades:
      turbine_max_cms: 6.9
      release_reason: release_high
      inflow_high_cms: 13.9
      rise_mcm_per_h: 0.0125
      rise_window_h: 1
      min_consecutive_h: 1
      stale_after_h: 48

  - code: klai_ban
    name: {th: "อ่างเก็บน้ำใกล้บ้าน", ms: "Empangan Klai Ban", en: "Klai Ban Reservoir"}
    river: {th: "คลองใกล้บ้าน", ms: "Sungai Klai Ban", en: "Klai Ban stream"}
    operator: RID
    province: "96"
    feed: daily
    thaiwater: {hourly_id: null, daily_id: 794}
    dam_point: [101.864788, 6.384195]
    spillway_point: null
    reservoir_way: 174680726
    reservoir_relation: null
    # The nearest mapped stream starts 2 km from the wall, which is not close enough to call it
    # this reservoir's outflow. Figures only until somebody maps the channel.
    outlet_way: null
    storage: {max_mcm: 3.73, normal_mcm: 3.73}
    tributaries: {min_network_km: 5, lower_reach_km: 5}
    grades:
      turbine_max_cms: 4.3
      release_reason: release_high
      inflow_high_cms: 8.6
      rise_mcm_per_h: 0.0078
      rise_window_h: 1
      min_consecutive_h: 1
      stale_after_h: 48

  - code: ban_baik
    name: {th: "อ่างเก็บน้ำบ้านไบก์", ms: "Empangan Ban Baik", en: "Ban Baik Reservoir"}
    river: {th: "ลำน้ำท้ายอ่างบ้านไบก์", ms: "Sungai hilir Ban Baik", en: "stream below Ban Baik"}
    operator: RID
    province: "95"
    feed: daily
    thaiwater: {hourly_id: null, daily_id: 58796}
    dam_point: [101.312051, 6.462641]
    spillway_point: null
    reservoir_way: null
    reservoir_relation: null
    outlet_way: null
    # ThaiWater publishes no capacity for it; 1.2 Mm3 is what its own percentage implies
    # (0.15 Mm3 at 12.33% on 14 Oct 2026). The smallest of the six by a long way.
    storage: {max_mcm: 1.2, normal_mcm: 1.2}
    tributaries: {min_network_km: 5, lower_reach_km: 5}
    grades:
      turbine_max_cms: 1.4
      release_reason: release_high
      inflow_high_cms: 2.8
      rise_mcm_per_h: 0.0025
      rise_window_h: 1
      min_consecutive_h: 1
      stale_after_h: 48

# Travel times (travel.py, METHODS.md "Travel times"). Hours after the gates open, as ranges.
travel:
  source: gauges-2026-10          # the version of these times; goes into the table beside the geometry's source
  # Gauges on the main stem, by ThaiWater station id. Their river distance is measured, not typed.
  gauges:
    - {code: BLGTD01, id: 562799, place: "tailwater bridge", point: [101.276104, 6.160477]}
    - {code: BLGTD02, id: 562800, place: "Bannang Sata", point: [101.268237, 6.262132]}
    # RID's X.77 stands at the same place (2,283 km2 above it). ThaiWater's station list gives it
    # a wrong position, on Khlong Yai 20 km to the west (station 1095877); its flow rating moves
    # by a factor of two between years (METHODS.md, "The outside check"), so it is not used here.
    - {code: BLGTD03, id: 709863, place: "Yala town (Tha Sap)", point: [101.266197, 6.552715]}
    # max_level_m: readings above it are a broken sensor, not a flood (X.40A once reported 35 m).
    - {code: X.40A, id: 2583, place: "Yala town (Tha Sap), RID", point: [101.266294, 6.552798], max_level_m: 30}
    - {code: X.275, id: 726684, place: "Ban Brido", point: [101.244888, 6.821520], max_level_m: 10}
    - {code: BLGTD05, id: 562803, place: "Pattani town", point: [101.251309, 6.859914], max_level_m: 10}
    - {code: X.10A, id: 2587, place: "Pattani town (Dechanuchit bridge), RID", point: [101.252129, 6.866000], max_level_m: 10}
  pulses: {months: [1, 2, 3, 4, 5], max_lag_h: 48, min_r: 0.25}
  floods: {quantile: 0.95, gap_days: 8, min_rise_m: 1.0, large_rise_m: 2.5}
  pairs:                           # upstream gauge, downstream gauge, longest lag looked for
    - [BLGTD02, BLGTD03, 48]
    - [BLGTD02, X.40A, 48]
    - [X.40A, X.275, 96]
    - [BLGTD03, X.275, 96]
    - [X.275, BLGTD05, 48]
    - [X.275, X.10A, 48]
  # The decided times at the gauges, read off the measurements of 12 Oct 2026 (METHODS.md has the
  # sums). earliest/latest: the first rise, hours after the gates open. peak_*: the highest water,
  # hours after the highest release. Between gauges the times go by river distance.
  anchors:
    - {gauge: BLGTD01, earliest_h: 0, latest_h: 0, peak_earliest_h: 0, peak_latest_h: 0}
    - {gauge: BLGTD02, earliest_h: 3, latest_h: 4, peak_earliest_h: 3, peak_latest_h: 4}
    - {gauge: BLGTD03, earliest_h: 9, latest_h: 18, peak_earliest_h: 15, peak_latest_h: 26}
    - {gauge: X.275, earliest_h: 14, latest_h: 32, peak_earliest_h: 40, peak_latest_h: 74}
    - {gauge: BLGTD05, earliest_h: 16, latest_h: 44, peak_earliest_h: 45, peak_latest_h: 90}
  # A warning counts down to the earliest time with this share taken off (spec section 15).
  safety_margin: 0.2

# The named criteria the app grades the live figures by (decision 10 Oct 2026). Starting values
# only: they are written into system_settings, which admins own, and `thresholds` prints what the
# archive says about each one. Flows are cubic metres per second.
#
# Two tiers, as the owner asked on 10 Oct: `watchful` is shown by the app itself with its
# disclaimer and no sound; `releasing` raises a notice for the admins, who review it and send the
# real alarm. Code never publishes an alert (safety rule 2).
grades:
  # Above this, more water is leaving than the turbines alone can pass, so a gate is open.
  turbine_max_cms: 160
  # Inflow this high fills the reservoir fast whatever the gates are doing.
  inflow_high_cms: 500
  # Storage climbing this fast (million m3 per hour, averaged over the window below).
  rise_mcm_per_h: 4.0
  rise_window_h: 6
  # A reading older than this is called out as stale rather than graded (safety rule 3's habit).
  #
  # Twelve hours, not six, because the feed itself lags: checked on 10 Oct 2026 at 06:00 Bangkok,
  # the newest hour ThaiWater published for this dam was 00:00, and the hours between were not
  # there yet. The app therefore always shows the reading's own time and age; "stale" is kept for
  # a lag that is abnormal even for this feed.
  stale_after_h: 12
  # How many readings in a row must meet a rule before it counts.
  #
  # The archive holds plainly impossible single hours: an outflow of 1,944 m3/s with no spill
  # (26 Jun 2015, against a record spill peak of 648), an inflow of 6,241 m3/s, a six-hour
  # storage rise of 141 Mm3/h. One of those must not wake the admins or put a notice on anyone's
  # screen. So a rule has to hold for two readings, an hour apart, before it grades.
  #
  # Nothing is thrown away and no value is called too big to be true: a lone reading is still
  # shown, labelled as waiting for the next one, and a release that is really happening confirms
  # itself within the hour.
  min_consecutive_h: 2

# The zone (zone.py, METHODS.md "The zone"): the land a rise in the river can reach, from the
# elevation model, checked against the radar. Starting values, decided 13 Oct 2026.
zone:
  dem: out/hazard/work/dem_utm.tif        # the unburned surface (the burned copy has rivers cut 10 m in)
  buildings: out/hazard/buildings/buildings_2023_30m.tif
  # Land farther than this from the channel is never in the zone, however low it lies: beyond it
  # the nearest-river reading stops meaning anything on the coastal plain.
  max_distance_km: 6
  surface: {bin_m: 500, low_percentile: 25, within_cells: 1}
  rises_m: [0.5, 1, 1.5, 2, 2.5, 3, 4, 5, 6]
  # The zone is the land no higher above the river than the river has been seen to rise: the
  # highest level in the archive at each of these gauges (RID's and EGAT's, listed under travel),
  # as a six-hour median, less the river surface from the elevation model at the gauge.
  flood_surface:
    gauges: [BLGTD02, X.40A, X.275, X.10A]
    smooth_h: 6
    min_rise_m: 1.0        # floor: the gorge below the dam, where the model's river surface is partly bank
    outer_extra_m: 1.0     # the outer band, drawn lighter: a metre above anything recorded
  simplify_m: 30
  min_patch_km2: 0.02
  seed: {simplify_m: 60, min_patch_km2: 0.05}    # the outlines the database and the map get
  radar:
    season_2020: out/sar_floods/products/jaga_sar_max_season-2020_20m_c97e0bf.tif   # holds the January 2021 release
    event_2024: out/sar_floods/products/jaga_sar_max_event-2024-nov-dec_10m_c97e0bf.tif
    event_2025: out/sar_floods/products/jaga_sar_max_event-2025-nov-dec_10m_c97e0bf.tif

# The overflow zone of a reservoir with no gauge below it (spill.py; METHODS.md, "A full
# reservoir's own zone"). The owner's choices of 26 Oct 2026: a day's spill sets the depth, the
# zone stops where the water joins a channel ten times its size, the arrival times are a plain
# channel speed, and a reservoir merely being full now grades as something.
#
# The five here are the Royal Irrigation Department's. Bang Lang is not: it has four gauges below
# it and keeps the zone S7 measured at them.
spill:
  source: spill                   # the geometry_source these zones are loaded under
  arrival_source: spill-2026-10   # the version of the arrival times, beside S7's gauges-2026-10
  reservoirs: [khlong_sadao, khlong_la, khlong_chamrai, klai_ban, ban_baik]
  # The hazard module's surface and its flow directions. The elevation model is the **unburned**
  # one for heights, as in `zone`; the pointer and the accumulation are from the breached copy,
  # which is what makes a path exist where no channel is mapped.
  dem: out/hazard/work/dem_utm.tif
  pointer: out/hazard/work/d8_pointer.tif
  accum: out/hazard/work/d8_accum.tif
  buildings: out/hazard/buildings/buildings_2023_30m.tif
  # Where the zone stops: the receiving channel draining this many times the reservoir's own
  # catchment. Past that junction the flood is the river's, and the river gauges warn for it.
  big_factor: 10
  # Never longer than this, however small the reservoir: a hill stream can run a long way before
  # it meets anything bigger than itself, and a 25 km reach is already more than one day's spill
  # can fill to any depth.
  max_reach_km: 25
  # Only a bound on the work: the corridor itself is the land that drains into the reach.
  max_distance_km: 3
  # How far from the given wall position to look for the channel when the pool is not mapped.
  snap_cells: 25
  surface: {bin_m: 500, low_percentile: 25, within_cells: 1}
  # Ground more than this far below the channel's surface counts as exactly this far below it:
  # one pit in a 30 m model must not swallow the day's volume and leave the valley dry.
  floor_below_channel_m: 2.0
  # The band is never thinner than the first or deeper than the second. A valley flat enough to
  # take the volume in a hand's depth still gets a drawable band; a gorge that would need more
  # than the ceiling is cut there rather than drawn as a wall of water.
  min_depth_m: 0.3
  max_depth_m: 5.0
  # The outer band is a margin as well as a wetter day: it is never drawn on the zone's own line.
  outer_extra_m: 0.5
  # A day's spill. The reservoir is already full, so what arrives has to leave: the catchment
  # above the wall times the wettest day the rain archive holds near it times the share that runs
  # off. The two coefficients give the two bands - 0.6 for the zone, and 0.9 for the outer band,
  # where the ground is already saturated and nearly all of it runs off.
  day_spill:
    rain_stations_km: 15     # rain gauges this near the wall (widened by 10 km until one is found)
    rain_min_days: 60        # a station with a shorter record than this is not used
    # A point ceiling: the archive holds single "days" of 1,052 mm and three 420 mm days in a
    # row at Sadao, which no rain in this region does (the satellite's wettest 24 hours over the
    # whole Khlong U-Taphao basin is 345 mm). Above this it is a gauge fault, not weather.
    rain_max_mm: 400
    # Some stations report a running total through a wet spell rather than the day's rain (station
    # 855 at Sadao ran to 1,035 mm over six days in November 2025). A run of this many days that
    # never falls and reaches this figure is differenced back into days (spill.py, `daily_rain`).
    accumulation_mm: 250
    accumulation_days: 3
    runoff: 0.6
    runoff_outer: 0.9
  # No gauge below these reservoirs, so no travel time can be measured. The fastest speed gives
  # the earliest the water could arrive, the slowest the latest, and every screen that shows them
  # says they are assumed (METHODS.md).
  velocity_ms: [0.5, 2.0]
  safety_margin: 0.2
  # A reservoir simply being full raised nothing until now: for all five, the capacity at normal
  # high water *is* the full capacity, so S7's `above_normal_high` could only fire above 100%.
  # These two are the share of capacity at which it becomes watchful, and the share at which a
  # notice goes to the admins. Admins own both numbers once they are in system_settings.
  near_full_pct: 80
  full_pct: 95
  # `spill rain` asks the satellite about the catchments the first pass wrote. The same
  # collection, band and grid the flood thresholds were measured on (thresholds/config.yaml), so
  # the two figures can be set beside each other, and the same flood-season window.
  seasons: {first: 2017, last: 2025, start_month: 10, end_month: 1}
  rain_fetch:
    collection: JAXA/GPM_L3/GSMaP/v8/operational
    band: hourlyPrecipRateGC      # gauge-adjusted, mm per hour
    scale_m: 11132                # the product's own 0.1 degree grid
    chunk_days: 10
  simplify_m: 30
  seed: {simplify_m: 60, min_patch_km2: 0.05}
  radar:
    season_2020: out/sar_floods/products/jaga_sar_max_season-2020_20m_c97e0bf.tif
    event_2024: out/sar_floods/products/jaga_sar_max_event-2024-nov-dec_10m_c97e0bf.tif
    event_2025: out/sar_floods/products/jaga_sar_max_event-2025-nov-dec_10m_c97e0bf.tif
