# docs/science-plan.md Module 8, part 2: where a main highway may be holding flood water back, and
# where an opening (bridge, culvert) may be missing or too small. Advice for the provincial highway
# and irrigation offices, never a public alert. Every number here is a starting value.

output_dir: out/highway_paths
user_agent: "jaga-pipeline/0.1 (+https://github.com/nafiscode/flood-warning-app; {contact})"
overpass_url:                        # the same free, keyless servers as safe_places, asked in turn
  - https://overpass-api.de/api/interpreter
  - https://overpass.private.coffee/api/interpreter
  - https://maps.mail.ru/osm/tools/overpass/api/interpreter
overpass_rounds: 6                   # rounds over all servers before a tile is given up (and named)

inputs:
  roads: out/safe_places/osm         # roads_*.npz, filled by `safe_places fetch`
  pointer: out/hazard/burned/d8_pointer.tif   # WhiteboxTools D8 codes, 30 m, rivers burned in
  accumulation: out/hazard/burned/d8_accum.tif  # cells draining through each cell
  dem: out/hazard/work/dem_utm.tif   # FABDEM, unburned, 30 m
radar_hash: c97e0bf                  # the second parameter set of S2; nothing else is read
pass_scale_m: 20                     # per-pass files at this scale (the 10 m event passes repeat them)
flood_codes: [1, 3]                  # the VV rule, as everywhere else in Jaga (2 = VH only is left out)
seasons: [2017, 2025]                # first and last season (named by the year they start in)

highways:
  kinds: [motorway, trunk, primary]  # the lines that get sections
  # Lines that also count as "the road" when the land beside a section is shared out: links and
  # the main lines themselves (a strip never reaches across another highway).
  blocking: [motorway, motorway_link, trunk, trunk_link, primary, primary_link]
  section_m: 500
  min_section_m: 150                 # a shorter end piece is added to the section before it
  step_m: 20                         # spacing of the sample points along the line and across it

sides:
  near_m: 30                         # the first 30 m from the centre line: the road and its embankment
  far_m: 300
  min_cells: 25                      # fewer observed 20 m cells than this on a side: that side is "not seen"
  # Upstream side. D8: the share of a side's cells whose flow direction points towards the road;
  # the side where more of the land drains to the road is upstream. DEM: the higher side on average.
  d8_margin: 0.10                    # D8 decides when its two shares differ by at least this
  dem_margin_m: 0.5                  # otherwise the DEM decides when the sides differ by at least this

flood:
  wetter_by: 0.10                    # a season counts as "wetter on one side" when the shares differ by this
  min_flooded_cells: 5               # and the wetter side has at least this many flooded cells
  pass_share: 0.10                   # a pass counts as "flooded on a side" from this share of its observed cells
  pass_min_cells: 10                 # observed cells a side needs in a pass for that pass to count

crossings:
  min_catchment_km2: 1.0             # a D8 flow path counts from this much land upstream of it
  opening_m: 100                     # a mapped bridge, culvert or waterway within this distance is "an opening"
  report_opening_within_m: 1000      # the nearest mapped opening is named up to this far, for the reader
  near_line_m: 45                    # a flow step is tested against the highway segments within this distance
  # A flow path that comes back to the side it left within this many 30 m steps is a stream running
  # along the road (zigzagging across it on the 30 m model), not one passing under it: left out.
  along_check_steps: 20

twins:
  # Dual carriageways are two one-way lines 10 to 60 m apart. Each takes the land on its own outer
  # side; the twin's side is borrowed so that both sides of the corridor are compared.
  max_gap_m: 80
  min_parallel: 0.9                  # |cos| of the angle between the two lines

score:
  # Each part is scaled to 0..1 at the value given, then weighted. Simple on purpose: every part is
  # one sentence in the report.
  asymmetry: {weight: 0.35, full_at: 0.25}      # mean of (upstream share - downstream share) over the seasons
  seasons: {weight: 0.15, full_at: 4}           # seasons upstream clearly wetter minus seasons downstream clearly wetter
  persistence: {weight: 0.20, full_at: 0.05}    # share of observed passes flooded, upstream minus downstream
  crossing: {weight: 0.15, full_at_km2: 100}    # largest catchment crossing the section (log scale from min_catchment_km2)
  no_opening: {weight: 0.15}                    # that crossing has no mapped opening within opening_m
  unclear_upstream_factor: 0.5       # asymmetry and persistence count half when the upstream side is unclear
classes:
  look_first: {min_score: 0.55, min_seasons_up: 2}
  # Above "no sign" only with some sign in the radar itself: a crossing with no mapped opening and
  # no difference between the sides is a question for the map, not evidence of held water.
  worth_a_look: {min_score: 0.30, min_asymmetry: 0.02, min_persistence: 0.01}

report:
  top_per_province: 5
  figures: 6                         # PNG figures of the top sections overall (0 = none)
