# Hazard baseline (S3): HAND from FABDEM, hazard classes, aggregation. Reasons and open points: METHODS.md.
# Nothing here has been tuned yet.

# Working area in whole degrees [west, south, east, north]: the four provinces plus everything that can
# drain into them (the Malaysian side of the Kolok basin, the Songkhla Lake basin to the north). The
# catchments themselves are cut out of this box from the DEM's own flow directions.
bbox_deg: [99, 5, 103, 9]

dem:
  # FABDEM V1-2, bare-earth 1 arc-second. Licence CC BY-NC-SA 4.0: non-commercial, and anything derived
  # from it (HAND, hazard classes) must be shared under the same licence with attribution.
  asset: projects/sat-io/open-datasets/FABDEM
  band: b1
  attribution: >-
    FABDEM (Hawker et al. 2022), CC BY-NC-SA 4.0. Produced using Copernicus WorldDEM-30 © DLR e.V.
    2010-2014 and © Airbus Defence and Space GmbH 2014-2018, provided under COPERNICUS by the
    European Union and ESA; all rights reserved.

water:
  asset: JRC/GSW1_4/GlobalSurfaceWater
  band: occurrence

export:
  drive_folder: jaga_hazard           # Google Drive folder for the two source rasters
  crs: "EPSG:32647"                   # working grid: UTM 47N, as the flood rasters
  scale_m: 30

hand:
  # Part of the box HAND is computed for, [west, south, east, north]. The whole box is about 220 million
  # cells, too many for a 16 GB laptop. To verify after the run: no catchment that reaches the four
  # provinces is cut by this edge.
  bbox_deg: [99.5, 5.5, 102.5, 8.5]
  sea_value_m: 0                      # FABDEM's value for the sea and Songkhla Lake: nodata, streams end there
  breach_dist_cells: 50               # longest cut through an embankment or dam: 1.5 km
  breach_max_cost: null               # no limit on the depth of a cut; what cannot be breached is filled
  # Candidate stream thresholds in 30 m cells (0.45, 0.9, 1.8 and 4.5 km2); one is chosen after the
  # comparison with mapped rivers.
  stream_thresholds_cells: [500, 1000, 2000, 5000]
  # Decided 2026-10-08 (docs/decisions.md): the product in <output_dir>/burned/.
  stream_threshold_cells: 1000        # 0.9 km2
  burn:
    waterway_classes: [river]         # OpenStreetMap; streams and canals are mapped too unevenly to trust
    depth_m: 10                       # routing only; HAND is measured on the unburned surface
  coastal_rule: sea_level             # land draining to the sea or the lake without a stream: height above sea level

# Mapped water the candidate stream networks are scored against (compare.py).
compare:
  overpass_url: https://overpass-api.de/api/interpreter
  user_agent: "Jaga/0.1 (non-profit flood warning; {contact})"    # contact from CONTACT_EMAIL
  waterway_classes: [river, canal, stream, drain]   # OpenStreetMap, ODbL: credit "© OpenStreetMap contributors"
  jrc_min_occurrence_pct: 50
  tolerance_cells: 2                  # a mapped cell counts as found with a modelled stream within 60 m

# Buildings on the hazard grid (buildings.py): the built-up mask and the building counts per class.
buildings:
  asset: GOOGLE/Research/open-buildings-temporal/v1
  year: 2023                          # the newest year in the dataset
  presence_band: building_presence
  count_band: building_fractional_count
  native_scale_m: 0.5
  attribution: "Open Buildings 2.5D Temporal Dataset, Google Research (Sirko et al. 2023), CC BY 4.0"

# Hazard classes (classes.py). Plan approved by the owner on 2026-10-09; every number is a starting value.
classes:
  radar_hash: cd222f1                 # which radar run feeds the classes; c97e0bf when the second run is in
  seasons: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  season_scale_m: 20
  events: [2024-nov-dec, 2025-nov-dec]
  event_scale_m: 10
  high: {min_seasons: 4, all_events: true}
  medium: {min_seasons: 2, min_frequency: 0.02, any_event: true}     # the frequency floor of 2026-10-08
  low: {max_hand_m: 2.0}
  radar_blind:                        # built-up land, and land the radar masks or never observed
    built_min_presence: 0.10          # mean building presence over the window below
    built_window_cells: 5             # 150 m: flooding between buildings is hidden well beyond one cell
    medium_max_hand_m: 2.0
    low_max_hand_m: 5.0
  # Places to read the result at: [west, south, east, north].
  benchmarks:
    "Hat Yai city centre (heavily flooded 19-21 Nov 2025, owner)": [100.455, 6.995, 100.485, 7.020]
    "Pattani town (flooded Nov 2024, owner)": [101.235, 6.855, 101.275, 6.885]

# Local outputs, relative to pipeline/ (ignored by git through the root rule "out/").
output_dir: out/hazard
