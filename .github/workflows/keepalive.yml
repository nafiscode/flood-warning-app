name: Keepalive

# GitHub disables scheduled workflows in public repos after 60 days without repository
# activity. The data jobs push to jaga-data, not here, so this repo can go quiet in the
# off-season. Re-enabling each scheduled workflow through the API resets that timer,
# without adding commits. Runs twice a month, well inside the 60 days.
on:
  schedule:
    - cron: "23 3 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    if: github.repository == 'nafiscode/flood-warning-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Re-enable scheduled workflows
        run: |
          for wf in keepalive.yml thaiwater-weekly.yml thaiwater-rain-hourly.yml thaiwater-backfill.yml; do
            gh api -X PUT "repos/$GH_REPO/actions/workflows/$wf/enable"
            echo "$wf: $(gh api "repos/$GH_REPO/actions/workflows/$wf" --jq .state)"
          done
