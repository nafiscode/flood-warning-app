name: Pipeline tests

on:
  push:
    paths: ["pipeline/**", ".github/workflows/pipeline-tests.yml"]
  pull_request:
    paths: ["pipeline/**"]

# Runs on pull requests from forks too: no secrets are used, and the token is read-only.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest -q
