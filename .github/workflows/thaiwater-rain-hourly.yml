name: ThaiWater hourly rain

# ThaiWater keeps hourly rain for only ~42 h. Every 12 h leaves 30 h of margin for a failed run.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

# Read-only token by default. The data push uses JAGA_DATA_TOKEN, scoped to jaga-data only.
permissions:
  contents: read

concurrency:
  group: jaga-data
  cancel-in-progress: false

jobs:
  rain-hourly:
    # Only in the main repo: never in forks, which have no access to the data token.
    if: github.repository == 'nafiscode/flood-warning-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/thaiwater-setup
        with:
          data-token: ${{ secrets.JAGA_DATA_TOKEN }}
      - name: Collect hourly rain
        working-directory: pipeline
        run: uv run python -m ingest_thaiwater rain-hourly
      # Reservoir release and spill by the hour (Bang Lang): the same 12-hourly rhythm.
      - name: Collect dam data
        working-directory: pipeline
        run: uv run python -m ingest_thaiwater dams --max-minutes 10
      - name: Push to jaga-data
        if: always()
        run: bash .github/actions/thaiwater-setup/push.sh "Hourly rain $(date -u +%Y-%m-%dT%H:%MZ)"
