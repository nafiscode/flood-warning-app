name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["pipeline/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["pipeline/**", "docs/**", "**/*.md"]

# Runs on pull requests from forks too: no secrets are used, and the token is read-only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - name: Start a throwaway Supabase for the sign-in flows
        # Database, sign-in service and API in Docker on the runner, with our migrations and seed.
        # Its keys are the Supabase CLI's public demo keys, not secrets; nothing here touches
        # jaga-dev or production. It comes before the build because NEXT_PUBLIC_* values are
        # built into the app.
        run: |
          npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,mailpit,supavisor
          npx supabase status -o env > "$RUNNER_TEMP/supabase.env"
          value() { grep -E "^$1=" "$RUNNER_TEMP/supabase.env" | head -1 | cut -d= -f2- | tr -d '"'; }
          publishable="$(value PUBLISHABLE_KEY)"
          [ -n "$publishable" ] || publishable="$(value ANON_KEY)"
          secret="$(value SECRET_KEY)"
          [ -n "$secret" ] || secret="$(value SERVICE_ROLE_KEY)"
          for name in API_URL DB_URL; do
            [ -n "$(value "$name")" ] || { echo "supabase status did not report $name"; exit 1; }
          done
          [ -n "$publishable" ] && [ -n "$secret" ] || { echo "supabase status reported no keys"; exit 1; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(value API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publishable"
            echo "SUPABASE_SECRET_KEY=$secret"
            echo "SUPABASE_DB_URL=$(value DB_URL)"
          } >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload the Playwright report if something failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rls:
    # RLS policy tests on a throwaway local Supabase database (Docker is built into the runner).
    # No secrets: this never touches jaga-dev or production.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start a throwaway database with our migrations and seed
        run: |
          npx supabase db start
          npx supabase db reset --local
      - run: npm run test:rls
