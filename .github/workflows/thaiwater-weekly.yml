name: ThaiWater weekly refresh

on:
  schedule:
    - cron: "0 20 * * 1" # Monday 20:00 UTC = Tuesday 03:00 Bangkok
  workflow_dispatch:

# Read-only token by default. The data push uses JAGA_DATA_TOKEN, scoped to jaga-data only.
permissions:
  contents: read

concurrency:
  group: jaga-data
  cancel-in-progress: false

jobs:
  refresh:
    # Only in the main repo: never in forks, which have no access to the data token.
    if: github.repository == 'nafiscode/flood-warning-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/thaiwater-setup
        with:
          data-token: ${{ secrets.JAGA_DATA_TOKEN }}
      - name: Refresh stations, water level, daily and hourly rain, coverage report
        # Exit code 2 = ThaiWater down or blocking GitHub's servers: the job fails and GitHub emails the owner.
        working-directory: pipeline
        run: uv run python -m ingest_thaiwater refresh
      - name: Push to jaga-data
        if: always()
        run: bash .github/actions/thaiwater-setup/push.sh "Weekly refresh $(date -u +%Y-%m-%d)"
