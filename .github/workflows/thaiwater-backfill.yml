name: ThaiWater daily-rain backfill

# Backfills daily rain to the target in config.yaml (Oct 2017), 5 hours per run.
# Once the backfill is complete, each run exits within a minute.
on:
  schedule:
    - cron: "40 22 * * *" # 05:40 Bangkok
  workflow_dispatch:

# Read-only token by default. The data push uses JAGA_DATA_TOKEN, scoped to jaga-data only.
permissions:
  contents: read

concurrency:
  group: jaga-data
  cancel-in-progress: false

jobs:
  backfill:
    # Only in the main repo: never in forks, which have no access to the data token.
    if: github.repository == 'nafiscode/flood-warning-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/thaiwater-setup
        with:
          data-token: ${{ secrets.JAGA_DATA_TOKEN }}
      - name: Backfill daily rain (time-boxed)
        working-directory: pipeline
        run: uv run python -m ingest_thaiwater backfill --max-minutes 300
      - name: Push to jaga-data
        if: always()
        run: bash .github/actions/thaiwater-setup/push.sh "Daily-rain backfill $(date -u +%Y-%m-%d)"
