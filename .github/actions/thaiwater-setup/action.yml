name: ThaiWater archive setup
description: Check out jaga-data into pipeline/data and install the pipeline with uv.
inputs:
  data-token:
    description: Fine-grained token with contents read/write on nafiscode/jaga-data
    required: true
runs:
  using: composite
  steps:
    - name: Check out jaga-data into pipeline/data
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: nafiscode/jaga-data
        token: ${{ inputs.data-token }}
        path: pipeline/data
    - name: Install uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      with:
        enable-cache: true
        cache-dependency-glob: pipeline/uv.lock
    - name: Install pipeline dependencies
      shell: bash
      working-directory: pipeline
      run: uv sync --frozen
